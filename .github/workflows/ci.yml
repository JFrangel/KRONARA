name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install dependencies (fast test tier -- no torch/diffusers)
        run: |
          pip install \
            "langgraph>=1.2,<2" "langgraph-checkpoint-sqlite>=3.1,<4" \
            "httpx>=0.28,<1" "sqlite-vec>=0.1.9,<0.2" \
            "edge-tts>=7,<8" "faster-whisper>=1.2,<2" \
            "sentence-transformers>=5,<6" "fastembed>=0.4" \
            "pillow>=10" "pytest>=9,<10" "pytest-timeout>=2,<3"
      - name: Run pytest
        run: pytest

  rust-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run cargo test
        working-directory: src-tauri
        run: cargo test

  frontend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npm test
