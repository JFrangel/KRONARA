[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kronara-agent-runtime"
version = "0.5.0"
description = "Local-first cognitive sidecar for Kronara"
requires-python = ">=3.11"
dependencies = [
  "langgraph>=1.2,<2",
  "langgraph-checkpoint-sqlite>=3.1,<4",
  "httpx>=0.28,<1",
  "sqlite-vec>=0.1.9,<0.2"
]

[project.optional-dependencies]
media = ["edge-tts>=7,<8", "faster-whisper>=1.2,<2"]
rag = ["sentence-transformers>=5,<6"]
rag-onnx = ["fastembed>=0.4"]
# Local Stable Diffusion image generation (V1+). Isolated from rag/media so
# fast tests never pull multi-GB torch wheels. Install torch separately with
# the matching CUDA index (see docs/roadmap) for GPU acceleration.
visual = ["diffusers>=0.31", "transformers>=4.44", "accelerate>=1.0", "peft>=0.13", "pillow>=10", "safetensors>=0.4", "huggingface_hub>=0.25"]
dev = ["pytest>=9,<10", "pytest-timeout>=2,<3", "pyinstaller>=6,<7"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["python"]
# A real hang here previously burned 18+ minutes silently: a scheduler-tick
# test's real-Reddit-authority fallback made live, unthrottled RSS calls
# across all 7 programs and hit Reddit's rate limiting mid-suite (fixed by
# mocking RedditRssReader in that test). 60s is generous for every real
# test in this suite (the slowest -- real SDXL generation under the GPU
# venv -- finishes in a few seconds each) while still catching a genuine
# hang quickly instead of silently, indefinitely blocking whoever runs it.
timeout = 60
